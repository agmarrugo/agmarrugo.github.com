name: Build and deploy Hugo site

on:
  push:
    branches:
      - source
  repository_dispatch:
    types:
      - spanish-updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.161.1
  TZ: America/Bogota

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo
        run: |
          curl -L -o "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}"
          sudo mv "${RUNNER_TEMP}/hugo" /usr/local/bin/

      - name: Check out English site
        uses: actions/checkout@v6
        with:
          ref: source
          submodules: recursive

      - name: Check out Spanish content
        uses: actions/checkout@v6
        with:
          repository: agmarrugo/agmarrugo-es
          ref: master
          path: _spanish

      - name: Include Spanish static files
        run: |
          mkdir -p static/es
          cp -R _spanish/static/. static/es/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --gc --minify

      - name: Verify preserved URLs
        run: node scripts/verify-build.mjs

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
